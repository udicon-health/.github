<svg width="1200" height="420" viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="UDICON Healthcare. Connected. Consented. Secure.">
  <defs>
    <pattern id="hatch-teal" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="3" height="8" fill="#00ACC1"/>
    </pattern>
    <pattern id="hatch-green" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <rect width="3" height="8" fill="#2E9E5B"/>
    </pattern>
    <pattern id="dots-blue" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="1.6" fill="#2E75B6"/>
    </pattern>
    <pattern id="dots-green" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="1.6" fill="#2E9E5B"/>
    </pattern>
    <pattern id="dots-dense" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.3" fill="#2E75B6"/>
    </pattern>
    <pattern id="lines-teal" width="80" height="10" patternUnits="userSpaceOnUse">
      <rect y="4" width="80" height="2" fill="#00ACC1"/>
    </pattern>
    <pattern id="lines-blue" width="80" height="10" patternUnits="userSpaceOnUse">
      <rect y="4" width="80" height="2" fill="#4A7BF7"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" rx="12" fill="#0d1b2a"/>

  <!-- Words -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="600" fill="#2E8BE0">
    <text x="56" y="128" font-size="84" letter-spacing="-2">Connected.</text>
    <text x="56" y="214" font-size="84" letter-spacing="-2">Consented.</text>
    <text x="56" y="300" font-size="84" letter-spacing="-2">Secure.</text>
  </g>
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#E6EDF5">
    <text x="58" y="352">Patient records that follow the patient across Kenyan health facilities,</text>
    <text x="58" y="377">shared only with the patient's consent.</text>
  </g>

  <!-- Shape grid: 4 x 4 cells of 80px, echoing the UDICON network mark -->
  <g transform="translate(756 30)">
    <!-- row 1 -->
    <circle cx="40" cy="40" r="38" fill="url(#hatch-teal)"/>
    <rect x="100" y="0" width="80" height="80" fill="url(#dots-blue)"/>
    <g transform="translate(200 0)">
      <line x1="40" y1="8" x2="40" y2="72" stroke="#2E75B6" stroke-width="2" opacity="0.5"/>
      <line x1="8" y1="40" x2="72" y2="40" stroke="#2E75B6" stroke-width="2" opacity="0.5"/>
      <line x1="14" y1="14" x2="66" y2="66" stroke="#2E75B6" stroke-width="2" opacity="0.5"/>
      <line x1="66" y1="14" x2="14" y2="66" stroke="#2E75B6" stroke-width="2" opacity="0.5"/>
      <circle cx="40" cy="40" r="12" fill="#2E75B6"/>
      <circle cx="40" cy="8" r="7" fill="#4A9BE8"/>
      <circle cx="72" cy="40" r="7" fill="#00ACC1"/>
      <circle cx="40" cy="72" r="7" fill="#2E9E5B"/>
      <circle cx="8" cy="40" r="7" fill="#4A9BE8"/>
    </g>
    <circle cx="340" cy="40" r="37" fill="none" stroke="#E6EDF5" stroke-width="2"/>

    <!-- row 2 -->
    <rect x="1" y="101" width="78" height="78" fill="none" stroke="#E6EDF5" stroke-width="2"/>
    <circle cx="140" cy="140" r="38" fill="#1B6FD1"/>
    <rect x="200" y="112" width="80" height="56" fill="url(#lines-teal)"/>
    <rect x="300" y="100" width="80" height="80" fill="#4A6CF7"/>

    <!-- row 3 -->
    <rect x="0" y="200" width="80" height="80" fill="url(#dots-green)"/>
    <circle cx="140" cy="240" r="37" fill="none" stroke="#E6EDF5" stroke-width="2"/>
    <circle cx="240" cy="240" r="38" fill="url(#dots-dense)" opacity="0.55"/>
    <circle cx="340" cy="240" r="38" fill="url(#hatch-green)"/>

    <!-- row 4 -->
    <rect x="0" y="312" width="80" height="56" fill="url(#lines-blue)"/>
    <circle cx="140" cy="340" r="38" fill="#4DD9EC"/>
    <rect x="201" y="301" width="78" height="78" fill="none" stroke="#E6EDF5" stroke-width="2"/>
    <rect x="300" y="300" width="80" height="80" fill="url(#dots-blue)"/>
  </g>
</svg>
